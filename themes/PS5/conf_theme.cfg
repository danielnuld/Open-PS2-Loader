# Tema PS5 para Open-PS2-Loader
#
# Instalacion: copia esta carpeta a <dispositivo>/THM/thm_PS5/ y elige "PS5" en
# Ajustes -> Interfaz -> Tema. NO es el tema por defecto (tarea 6.4).
#
# El prefijo "thm_" es OBLIGATORIO: thmReadEntry() (themes.c) solo reconoce como
# tema los directorios que lo llevan, y toma el nombre a mostrar a partir del
# quinto caracter. Sin el prefijo, la carpeta se ignora y el tema ni siquiera
# aparece en la lista de Ajustes.
#
# El orden de los elementos importa, y no es cosmetico: FrostedPanel desenfoca
# lo que ya se haya dibujado en el frame. Asi que el fondo va antes del panel,
# y el shelf despues, para quedar nitido ENCIMA del cristal.
#
#   main0  CoverWallpaper -> el arte _BG del juego, nitido, con velo en degradado
#   main1  FrostedPanel   -> el cristal, a pantalla completa
#   main2  CardShelf      -> las portadas, nitidas, sobre el cristal
#   main3  ItemTitle      -> el NOMBRE del juego enfocado, en Titillium
#   main4  HintText       -> la botonera de abajo
#   main5  ItemsList      -> fuera de pantalla; define el tamano de pagina

# TIENE que ser 1. Este tema no trae NI UN PNG: se apoya entero en el arte
# interno de OPL. Con use_default=0, thmLoadResource() no cae de vuelta a las
# texturas internas cuando el archivo no esta en la carpeta del tema, y TODAS
# las texturas se quedan con Mem = NULL. A partir de ahi thmGetTexture()
# devuelve NULL para cada icono, y diaRenderUI() -- la pantalla de Ajustes --
# lo desreferencia sin comprobarlo. Es decir: el cuelgue ocurria en el mismo
# dialogo desde el que eliges el tema.
use_default=1

bg_color=#101018
text_color=#e8e8f0
sel_text_color=#ffffff
ui_text_color=#a0a0b0

# Titillium Web SemiBold: el equivalente libre mas parecido a la SST de Sony,
# que es propietaria y no se puede redistribuir. Licencia SIL OFL 1.1, incluida
# en OFL-TitilliumWeb.txt -- se puede redistribuir con el tema sin problema.
#
# Va como font1, NO como default_font: la fuente por defecto la usan tambien los
# hints y los menus de OPL, que estan medidos para la interna. Solo el titulo la
# pide, via main3_font=1.
font1=TitilliumWeb-SemiBold.ttf
font1_size=30

# --- Pantalla principal ---------------------------------------------------

# El wallpaper ES el fondo, y cuenta como Background, asi que va primero.
#
# Se alimenta del arte _BG.png del juego (<ART>/<SERIAL>_BG.png), a resolucion
# NATIVA y sin desenfocar. La version anterior estiraba la portada de 128x192 a
# 640x480 y la desenfocaba para disimular el estirado; el resultado era una
# mancha de color. El _BG es arte dibujado justo para ocupar la pantalla.
#
# Contrapartida honesta: los juegos SIN _BG.png se quedan sin fondo y caen al
# negro de debajo. Si prefieres el comportamiento anterior para todos, pon
# main0_pattern=COV, que reactiva el tile y el desenfoque automaticamente.
#
# El velo en degradado no es decoracion: el arte puede ser muy claro y el texto
# de la interfaz es blanco. Mas oscuro abajo, que es donde se apoya el titulo.
# Ahora que el fondo es nitido, se puede bajar respecto a antes.
main0_type=CoverWallpaper
main0_pattern=BG
main0_blur=0
main0_fade_ms=350
main0_veil_top=#000000
main0_veil_top_alpha=24
main0_veil_bottom=#000000
main0_veil_bottom_alpha=96
# Ojo: son texturas de tamano nativo (~900 KiB cada una), no tiles de 48 KiB.
# El pool tras los framebuffers es de 1632 KiB, asi que una cache profunda solo
# haria trillar al TexManager.
main0_count=3

# El panel de cristal, ahora a PANTALLA COMPLETA: el fondo se ve a traves de el,
# desenfocado, en vez de quedar tapado por un recuadro plano.
#
# La clave es main1_alpha. El _color es solo el TINTE que se compone ENCIMA del
# desenfoque, y hasta ahora su alfa lo fijaba initBasic a 0x80 -- que en el GS
# es OPACO. Por eso el panel salia como una caja oscura maciza y se comia la
# imagen de fondo. Con 0x28 el tinte apenas oscurece y lo que domina es el
# desenfoque, que es justo el efecto de cristal.
#
# Escala: 0x80 = opaco, 0x00 = invisible. Subelo si el texto no contrasta.
#
# Si no hay VRAM para el blur, o estamos en 720p/1080i, esto degrada a solo el
# tinte -- que al ser tan tenue deja el fondo nitido. Sigue siendo usable.
main1_type=FrostedPanel
main1_x=0
main1_y=0
main1_width=640
main1_height=480
main1_color=#101828
main1_alpha=40

main2_type=CardShelf
main2_x=40
main2_y=200
main2_width=560
main2_height=240
# El tile que produce el reescalador. Cambiarlo aqui NO cambia el tamano de la
# textura: las portadas siempre se reescalan a 128x192 CT16 al cargarse.
main2_card_width=128
main2_card_height=192
main2_spacing=24
# Cuanto se eleva y cuanto crece la portada enfocada. focus_scale va en tanto
# por ciento porque la config de temas solo lee enteros.
main2_lift=16
main2_focus_scale=115
main2_count=10

# El NOMBRE del juego, no el serial.
#
# ItemText dibuja itemGetStartup() -- "SLUS_203.28" -- y eso es a proposito en
# upstream: hay temas que cuentan con ello, asi que no se toca. ItemTitle es el
# tipo nuevo, y saca la misma cadena legible que usa el estante cuando a un
# juego le falta la portada.
#
# Sube por encima del estante, que es donde la pone una consola, y usa font1
# (Titillium a 30 px) en lugar de la interna.
main3_type=ItemTitle
main3_x=POS_MID
main3_y=150
main3_aligned=10
main3_font=1

main4_type=HintText

# La lista vertical clasica. El tema NO la quiere a la vista -- el CardShelf es
# quien dibuja los juegos -- pero el elemento tiene que existir igualmente, por
# dos razones:
#
#   1. menusys.c lee gTheme->itemsList->extended sin comprobar si es NULL, desde
#      menuNextV/menuPrevV/menuNextH/menuPrevH. Un tema sin ItemsList cuelga OPL
#      en cuanto tocas la cruceta.
#   2. Es el ItemsList quien define el TAMANO DE PAGINA (displayedItems =
#      height / MENU_ITEM_HEIGHT, y MENU_ITEM_HEIGHT vale 19). El CardShelf hace
#      su culling sobre menu->item->pagestart, asi que si la pagina no coincide
#      con el numero de tarjetas visibles, la seleccion se sale del estante y el
#      foco se queda clavado en la primera.
#
# El estante muestra width/(card_width+spacing) + 1 = 560/152 + 1 = 4 tarjetas,
# asi que la pagina tiene que ser de 4: height = 4 * 19 = 76.
#
# Y se coloca fuera de pantalla (y=500, por debajo de los 480 del espacio
# logico) para que el GS lo recorte y no se vea.
main5_type=ItemsList
main5_x=0
main5_y=500
main5_width=640
main5_height=76

# --- Pantalla de informacion ----------------------------------------------

# Mismo fondo que la principal: _BG nitido, sin desenfoque. Aqui el velo va mas
# cargado porque encima se apoyan varias lineas de texto, no solo el titulo.
info0_type=CoverWallpaper
info0_pattern=BG
info0_blur=0
info0_fade_ms=350
info0_veil_top_alpha=48
info0_veil_bottom_alpha=112
info0_count=3

info1_type=FrostedPanel
info1_x=40
info1_y=60
info1_width=560
info1_height=360
info1_color=#101828
info1_alpha=48

info2_type=ItemCover
info2_x=140
info2_y=240
info2_width=160
info2_height=240

info3_type=ItemText
info3_x=340
info3_y=100

info4_type=HintText
