# Tema PS5 para Open-PS2-Loader
#
# Instalacion: copia esta carpeta a <dispositivo>/THM/PS5/ y elige "PS5" en
# Ajustes -> Interfaz -> Tema. NO es el tema por defecto (tarea 6.4).
#
# El orden de los elementos importa, y no es cosmetico: FrostedPanel desenfoca
# lo que ya se haya dibujado en el frame. Asi que el fondo va antes del panel,
# y el shelf despues, para quedar nitido ENCIMA del cristal.
#
#   main0  Background     -> el fondo
#   main1  FrostedPanel   -> lo desenfoca y le pone el velo
#   main2  CardShelf      -> las portadas, nitidas, sobre el cristal
#   main3  ItemText       -> el titulo del juego enfocado

use_default=0

bg_color=#101018
text_color=#e8e8f0
sel_text_color=#ffffff
ui_text_color=#a0a0b0

# --- Pantalla principal ---------------------------------------------------

main0_type=Background
main0_pattern=BG
main0_count=5

# El panel de cristal. Cubre la franja donde vive el shelf, asi que las
# portadas flotan sobre un fondo desenfocado en vez de sobre el fondo crudo.
# El color es el TINTE que se compone encima del desenfoque; su alpha manda.
# Si no hay VRAM para el blur, o estamos en 720p/1080i, esto degrada solo al
# tinte y la interfaz sigue funcionando.
main1_type=FrostedPanel
main1_x=0
main1_y=150
main1_width=640
main1_height=300
main1_color=#181828

main2_type=CardShelf
main2_x=40
main2_y=180
main2_width=560
main2_height=240
# El tile que produce el reescalador. Cambiarlo aqui NO cambia el tamano de la
# textura: las portadas siempre se reescalan a 128x192 CT16 al cargarse.
main2_card_width=128
main2_card_height=192
main2_spacing=24
# Cuanto se eleva y cuanto crece la portada enfocada. focus_scale va en tanto
# por ciento porque la config de temas solo lee enteros.
main2_lift=16
main2_focus_scale=115
main2_count=10

main3_type=ItemText
main3_x=POS_MID
main3_y=440
main3_aligned=10

main4_type=HintText

# --- Pantalla de informacion ----------------------------------------------

info0_type=Background
info0_pattern=BG
info0_count=5

info1_type=FrostedPanel
info1_x=40
info1_y=60
info1_width=560
info1_height=360
info1_color=#181828

info2_type=ItemCover
info2_x=140
info2_y=240
info2_width=160
info2_height=240

info3_type=ItemText
info3_x=340
info3_y=100

info4_type=HintText
